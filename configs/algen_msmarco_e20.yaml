model_name: google/flan-t5-base
max_length: 32
output_dir: attacker/outputs
seed: 42

defense:
  method: none

pretrain:
  dataset: beir/trec-covid
  samples: 50000
  val_samples: 200
  align_reserve: 500
  batch_size: 128
  lr: 1.0e-4
  epochs: 12

finetune:
  dataset: msmarco-1m
  samples: 30000          
  val_samples: 500
  align_reserve: 1000     
  batch_size: 64
  lr: 1.0e-4              
  epochs: 20

attack:
  dataset: msmarco-1m
  victim_model: gtr-base
  embeddings: gtr-base__msmarco__*.npz
  align_samples: 1000
  reg_lambda: 0.1
  align_text: truncated
